[project]
name = "hypersonic"
version = "0.1.0"
description = "A lean general-purpose agent harness"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.1", "bashlex>=0.18", "fastapi>=0.115", "openai>=1.40", "textual>=0.80", "uvicorn>=0.30"]

[project.optional-dependencies]
app = ["pywebview>=5.0"]

[project.scripts]
hypersonic = "hypersonic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypersonic"]

[tool.hatch.build.targets.wheel.force-include]
"hypersonic/ui.html" = "hypersonic/ui.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
